name: CI/CD — Fila Certa (cliente Flutter)

# Equivalente ao pipeline do repo da equipa (fila-certa-staff/.github/
# workflows/ci.yml), adaptado à realidade Flutter/web deste repo:
#
#   Código → flutter analyze → flutter test → build web → Deploy → Smoke Test
#
# Sem testes de Supabase aqui -- os caminhos de dados novos desta app já
# são cobertos pelo scripts/test-flutter-data-paths.mjs no repo da
# equipa (corre contra o Supabase local efémero desse CI). Este pipeline
# valida o que é específico deste repo: análise estática, os testes de
# widget existentes (documentados como skip -- ver test/widget_test.dart),
# e a app web publicada.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  quality:
    name: Qualidade e segurança (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Análise estática (bloqueante)
        run: flutter analyze

      - name: Testes de widget (os 4 testes existentes ficam skip -- ver comentário no topo de test/widget_test.dart)
        run: flutter test

      - name: Sem segredos acidentais (.env, chaves privadas)
        run: |
          set -e
          if git ls-files | grep -E '^\.env($|\.local$)'; then
            echo "::error::Ficheiro .env/.env.local não deveria estar versionado."
            exit 1
          fi
          if git grep -nE "BEGIN (RSA )?PRIVATE KEY" -- '*.dart' '*.yaml' '*.json' ':!pubspec.lock'; then
            echo "::error::Possível chave privada commitada."
            exit 1
          fi
          echo "OK: nenhum segredo encontrado."

      - name: Sem regressão de Firebase (0 referências fora das excepções documentadas)
        run: |
          set -e
          BANNED='firebase|firestore|google-services|firebase_options|FirebaseAuth|FirebaseFirestore'
          HITS=""
          LIB_HITS=$(git grep -liE "$BANNED" -- lib/ || true)
          if [ -n "$LIB_HITS" ]; then echo "$LIB_HITS"; HITS="sim"; fi
          PUBSPEC_HITS=$(git grep -iE "$BANNED" -- pubspec.yaml || true)
          if [ -n "$PUBSPEC_HITS" ]; then echo "$PUBSPEC_HITS"; HITS="sim"; fi
          if [ -n "$HITS" ]; then
            echo "::error::Referência a Firebase encontrada -- esta app já migrou para Supabase (ver docs/migration-plan.md)."
            exit 1
          fi
          echo "OK: 0 referências Firebase."

      - name: Dependências desactualizadas/vulneráveis (informativo)
        run: flutter pub outdated || true

  build-web:
    name: Build web
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build para GitHub Pages (base href /DevSYNOVAR/)
        run: flutter build web --base-href /DevSYNOVAR/

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  deploy:
    name: Deploy (GitHub Pages) + Smoke Test
    needs: [build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Preparar artefacto (SPA fallback + .nojekyll)
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Publicar em gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/deploy origin/gh-pages
          rm -rf /tmp/deploy/*
          cp -r build/web/. /tmp/deploy/
          cd /tmp/deploy
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para publicar (build idêntico ao já publicado)."
          else
            git commit -m "deploy: ${{ github.sha }}"
            git push origin HEAD:gh-pages
          fi

      - name: Smoke test pós-deploy
        run: |
          set -e
          sleep 20
          code=$(curl -s -o /tmp/index.html -w "%{http_code}" --max-time 20 https://paulinoquicassa.github.io/DevSYNOVAR/)
          test "$code" = "200" || { echo "::error::HTTP $code na app publicada."; exit 1; }
          grep -qi 'flutter' /tmp/index.html || { echo "::error::index.html publicado não parece a app Flutter."; exit 1; }
          if grep -iE 'firebase|firestore' /tmp/index.html; then
            echo "::error::Referência a Firebase encontrada no HTML publicado."
            exit 1
          fi
          echo "OK: smoke test passou (HTTP 200, app carregada, sem Firebase)."
